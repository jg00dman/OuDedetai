name: Build Akousousin working branch
on:
  workflow_dispatch:
  push:
    branches: [codex/akousousin]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install '.[build]'
      - name: Full suite with separately maintained portable size-test fixtures
        run: |
          cp tests/test_backup.py /tmp/test_backup.py
          cp tests/test_utils.py /tmp/test_utils.py
          git fetch --depth=1 origin codex/akousousin-test-fixtures
          git show FETCH_HEAD:tests/test_backup.py > tests/test_backup.py
          git show FETCH_HEAD:tests/test_utils.py > tests/test_utils.py
          python -m unittest discover -v
          mv /tmp/test_backup.py tests/test_backup.py
          mv /tmp/test_utils.py tests/test_utils.py
      - name: Check speech controls
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a python - <<'PY'
          from tkinter import Tk
          from ou_dedetai.gui import ControlGui
          root = Tk()
          gui = ControlGui(root)
          root.update()
          assert gui.speech_checkbox.cget('text') == 'Enable speech'
          assert gui.speech_configure.cget('text') == 'Configure speech…'
          assert gui.speech_checkbox.instate(['disabled'])
          assert gui.speech_configure.instate(['disabled'])
          root.destroy()
          PY
      - name: Build and smoke-test existing binary format
        run: |
          bash scripts/build-binary.sh x86_64
          mv dist/oudedetai dist/oudedetai-x86_64
          dist/oudedetai-x86_64 --help
          cp AKOUSOUSIN.md dist/
          (cd dist && sha256sum oudedetai-x86_64 AKOUSOUSIN.md > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oudedetai-akousousin-x86_64-${{ github.run_id }}
          path: |
            dist/oudedetai-x86_64
            dist/AKOUSOUSIN.md
            dist/SHA256SUMS
