name: Publish Piper integration beta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    uses: ./.github/workflows/build-branch.yml
    with:
      branch: ${{ github.ref_name }}
  publish:
    needs: launcher
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: oudedetai-x86_64
          path: beta-dist
      - name: Prepare checksum and instructions
        run: |
          cp PIPER.md beta-dist/
          cd beta-dist
          sha256sum oudedetai-x86_64 PIPER.md > SHA256SUMS
      - name: Publish a unique experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "piper-beta-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title 'OuDedetai OpenSAPI Read Aloud beta' --notes-file PIPER.md beta-dist/*
